[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claire"
version = "0.2.1"
description = "CLAIRE — Conversational Local Audio Intelligent Runtime Engine"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Philip Santiago", email = "phil.santiago@gmail.com" },
]
requires-python = ">=3.9"
dependencies = [
  "ollama>=0.6.2",
  "sshkeyboard>=2.3.1",
  "sounddevice>=0.5.6",
  "numpy>=2.0.2",
  "piper-tts>=1.8.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "python-dotenv>=1.0.0",
  "rapidfuzz>=3.0.0",
  "httpx>=0.27.0",
]

[tool.setuptools]
packages = []
